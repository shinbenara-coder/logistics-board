# 대한제당 자가 냉동창고 매입 기준 (기획팀 기준, 2026.9) — 숫자만 바꾸면 등급이 다시 매겨집니다.
regions:            # 수집 대상 시도 (그 밖은 버림)
  - 경기
  - 인천
  - 서울
  - 충북
  - 충남
  - 세종
  - 대전
location_tiers:     # 위치 순위: 시군구 이름이 주소에 포함되면 해당 순위
  1: [용인, 수원, 화성, 오산, 성남, 의왕]          # 경부라인(신갈·기흥 중심)
  2: [광주, 이천, 하남, 음성, 진천, 여주]          # 중부라인
  3: [안성, 평택, 충주, 장호원]                    # 3번국도·기타 경기 동남부
price_tiers:        # 매입금액(억원): 이하이면 해당 순위
  1: 250            # 1순위 200억 전후
  2: 350            # 2순위 300억 전후
  3: 500            # 참고 상한
area_pyeong:        # 연면적(평) 적정 범위 — 자가 3,000~4,000평 + 임대
  min: 3000
  max: 12000
keywords:
  include: [창고, 물류, 냉동, 냉장, 저온, 콜드, 로지스, 풀필먼트, 상온센터]
  cold: [냉동, 냉장, 저온, 콜드, 신선]
  exclude: [임대, 사무실 일부, 아파트, 오피스텔, 근린생활]
news_queries:       # 뉴스(구글 뉴스 RSS) 검색어
  - 냉동창고 매각
  - 저온 물류센터 매각
  - 냉장 물류센터 매각
  - 물류센터 매각 우선협상
  - 물류센터 공매
  - 냉동창고 공매
  - 냉동창고 경매
  - 물류센터 경매
news_days: 45       # 이 기간(일) 안의 기사만
