<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>냉동창고 매물 트래킹</title>
<style>
:root{--navy:#1F4E79;--blue:#1F63A0;--sky:#DDEBF7;--line:#D9DEE5;--ink:#1F2328;--sub:#5B6470;--bg:#F6F8FA;--card:#FFFFFF;
--A:#C00000;--Abg:#FDECEC;--B:#B35C00;--Bbg:#FFF3E0;--C:#3D6A99;--Cbg:#EAF2FA;--D:#6B7280;--Dbg:#F1F2F4;--new:#E8590C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--line:#30363D;--ink:#E6EDF3;--sub:#9BA4AE;--bg:#0D1117;--card:#161B22;--sky:#1C2D40;
--Abg:#3A1518;--Bbg:#3A2A12;--Cbg:#15253A;--Dbg:#22262C}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:linear-gradient(90deg,var(--navy),var(--blue));color:#fff;padding:18px 16px 14px}
header h1{margin:0;font-size:20px} header p{margin:4px 0 0;font-size:12px;opacity:.85}
main{max-width:1200px;margin:0 auto;padding:14px 16px 40px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.kpi b{display:block;font-size:22px} .kpi span{font-size:12px;color:var(--sub)}
.kpi.on{outline:2px solid var(--blue)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.filters input[type=search]{flex:1;min-width:160px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.filters select{padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.filters label{font-size:13px;white-space:nowrap}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th{background:var(--blue);color:#fff;font-weight:600;padding:8px 6px;font-size:12.5px;text-align:center;white-space:nowrap}
td{border-top:1px solid var(--line);padding:8px 6px;vertical-align:top;font-size:13px}
td.c{text-align:center} td.r{text-align:right;white-space:nowrap}
.g{display:inline-block;min-width:24px;padding:2px 6px;border-radius:4px;font-weight:700;text-align:center}
.gA{color:var(--A);background:var(--Abg)}.gB{color:var(--B);background:var(--Bbg)}.gC{color:var(--C);background:var(--Cbg)}.gD{color:var(--D);background:var(--Dbg)}
.t a{color:var(--ink);font-weight:600;text-decoration:none} .t a:hover{text-decoration:underline}
.sub{color:var(--sub);font-size:12px;margin-top:2px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:10px;border:1px solid var(--line);color:var(--sub);margin-right:3px}
.cold{color:#0B6BCB;border-color:#9CC3EE}.new{color:#fff;background:var(--new);border-color:var(--new)}
.dday{font-weight:700;color:var(--A)}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:12px}
details summary{cursor:pointer;font-weight:600}
.st{font-size:12px;color:var(--sub)} .ok{color:#2E7D32}.bad{color:var(--A)}
.empty{padding:30px;text-align:center;color:var(--sub)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(3,1fr)} thead{display:none} table,tbody,tr,td{display:block;width:100%}
 tr{border-top:1px solid var(--line);padding:6px 4px} td{border:0;padding:3px 6px} td.c,td.r{text-align:left} td[data-l]::before{content:attr(data-l)" ";color:var(--sub);font-size:11px}}
</style>
</head>
<body>
<header><h1>냉동창고 매물 트래킹</h1><p id="upd">불러오는 중…</p></header>
<main>
 <div class="kpis" id="kpis"></div>
 <div class="tabs" id="tabs"></div>
 <div class="filters">
  <input type="search" id="q" placeholder="주소·물건명·기관 검색">
  <select id="loc"><option value="">위치 전체</option><option value="1">1순위(경부)</option><option value="2">2순위(중부)</option><option value="3">3순위(3번국도·기타)</option></select>
  <label><input type="checkbox" id="cold"> 냉동·저온만</label>
  <label><input type="checkbox" id="onlynew"> 신규만</label>
  <select id="sort"><option value="grade">등급순</option><option value="due">마감 임박순</option><option value="price">금액 낮은순</option><option value="recent">최근 등록순</option></select>
 </div>
 <table><thead><tr><th>등급</th><th>물건</th><th>출처·상태</th><th>연면적</th><th>금액</th><th>마감/일자</th><th>판단 근거</th></tr></thead><tbody id="rows"></tbody></table>
 <div class="empty" id="empty" hidden>조건에 맞는 매물이 없습니다.</div>
 <details><summary>매입 기준 (기획팀)</summary><div id="crit" class="st"></div></details>
 <details><summary>수집 상태</summary><div id="status" class="st"></div></details>
</main>
<script>
const $=s=>document.querySelector(s);
const st={tab:'전체',grade:'',q:'',loc:'',cold:false,onlynew:false,sort:'grade'};
const TABS=['전체','온비드 공매','법원경매','중개·채권','뉴스'];
let D={items:[]};
function load(){try{const u=new URLSearchParams(location.hash.slice(1));for(const k of Object.keys(st)){if(u.has(k))st[k]=typeof st[k]==='boolean'?u.get(k)==='1':u.get(k)}}catch(e){}}
function save(){const u=new URLSearchParams();for(const[k,v]of Object.entries(st)){if(v&&v!=='grade'&&v!=='전체')u.set(k,v===true?'1':v)}history.replaceState(null,'','#'+u)}
function tabOf(r){if(r.src==='온비드 공매')return '온비드 공매';if(r.src==='뉴스')return '뉴스';if((r.src||'').includes('경매'))return '법원경매';return '중개·채권'}
function dday(s){if(!s)return '';const d=new Date(s.slice(0,10)+'T00:00:00+09:00'),t=new Date();t.setHours(0,0,0,0);const n=Math.round((d-t)/864e5);return n<0?'종료':n===0?'D-day':'D-'+n}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
 save();
 const all=D.items, cnt=g=>all.filter(r=>r.grade===g).length;
 $('#kpis').innerHTML=[['','전체',all.length],['A','A 적합',cnt('A')],['B','B 검토',cnt('B')],['C','C 참고',cnt('C')+cnt('D')],['new','신규',all.filter(r=>r.is_new).length]]
  .map(([g,l,n])=>`<div class="kpi ${(st.grade===g&&g!=='new')||(g==='new'&&st.onlynew)?'on':''}" data-g="${g}"><b>${n}</b><span>${l}</span></div>`).join('');
 document.querySelectorAll('.kpi').forEach(e=>e.onclick=()=>{const g=e.dataset.g;if(g==='new'){st.onlynew=!st.onlynew;$('#onlynew').checked=st.onlynew}else st.grade=st.grade===g?'':g;render()});
 $('#tabs').innerHTML=TABS.map(t=>`<button class="${st.tab===t?'on':''}">${t} (${t==='전체'?all.length:all.filter(r=>tabOf(r)===t).length})</button>`).join('');
 document.querySelectorAll('#tabs button').forEach((b,i)=>b.onclick=()=>{st.tab=TABS[i];render()});
 const q=st.q.trim();
 let L=all.filter(r=>(st.tab==='전체'||tabOf(r)===st.tab)&&(!st.grade||r.grade===st.grade||(st.grade==='C'&&r.grade==='D'))
  &&(!st.loc||String(r.loc_tier)===st.loc)&&(!st.cold||r.cold)&&(!st.onlynew||r.is_new)
  &&(!q||[r.title,r.addr,r.org,r.memo].join(' ').includes(q)));
 const go={A:0,B:1,C:2,D:3};const dk=r=>{const d=r.deadline||'';return d&&dday(d)!=='종료'?d:'9'};
 const so={grade:(a,b)=>go[a.grade]-go[b.grade]||dk(a).localeCompare(dk(b)),
  due:(a,b)=>dk(a).localeCompare(dk(b)),price:(a,b)=>(a.price_eok??1e9)-(b.price_eok??1e9),
  recent:(a,b)=>(b.first_seen||b.date||'').localeCompare(a.first_seen||a.date||'')};
 L.sort(so[st.sort]);
 $('#rows').innerHTML=L.map(r=>{const dd=dday(r.deadline);
  return `<tr><td class="c" data-l="등급"><span class="g g${r.grade}">${r.grade}</span></td>
  <td class="t"><a href="${esc(r.url||'#')}" target="_blank" rel="noopener">${esc(r.title)}</a>
   <div class="sub">${r.is_new?'<span class="tag new">NEW</span>':''}${r.cold?'<span class="tag cold">냉동·저온</span>':''}${esc(r.addr)}${r.org?' · '+esc(r.org):''}</div>
   ${r.memo?`<div class="sub">${esc(r.memo)}</div>`:''}</td>
  <td class="c" data-l="출처">${esc(r.src)}<div class="sub">${esc(r.status||'')}${r.fails?' · 유찰 '+r.fails+'회':''}</div></td>
  <td class="r" data-l="연면적">${r.area_py?r.area_py.toLocaleString()+'평':'—'}${r.built?`<div class="sub">${esc(r.built)}</div>`:''}</td>
  <td class="r" data-l="금액">${r.price_eok!=null?'<b>'+Number(r.price_eok).toLocaleString()+'억</b>':'—'}<div class="sub">${esc(r.price_note||'')}${r.price_change?' ('+esc(r.price_change)+')':''}</div></td>
  <td class="c" data-l="마감">${r.deadline?esc(r.deadline.slice(0,10))+`<div class="sub dday">${dd}</div>`:esc(r.date||'')}</td>
  <td data-l="근거"><span class="sub">${esc(r.why)}</span></td></tr>`}).join('');
 $('#empty').hidden=L.length>0;
}
function init(){
 load();$('#q').value=st.q;$('#loc').value=st.loc;$('#cold').checked=st.cold;$('#onlynew').checked=st.onlynew;$('#sort').value=st.sort;
 $('#q').oninput=e=>{st.q=e.target.value;render()};$('#loc').onchange=e=>{st.loc=e.target.value;render()};
 $('#cold').onchange=e=>{st.cold=e.target.checked;render()};$('#onlynew').onchange=e=>{st.onlynew=e.target.checked;render()};
 $('#sort').onchange=e=>{st.sort=e.target.value;render()};
 fetch('data/listings.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;
  $('#upd').textContent=`최종 갱신 ${d.updated} (매일 08·14·18시 자동) · 기준: 냉동 1.5~2만톤 · 경부>중부>3번국도 · 200~300억`;
  const c=d.criteria||{};
  $('#crit').innerHTML=`<p><b>A 적합</b> 냉동·저온 + 위치 1·2순위 + ${c.price_tiers?.[2]??350}억 이하 + 연면적 ${c.area_pyeong?.min}~${c.area_pyeong?.max}평<br><b>B 검토</b> 위치 3순위·${c.price_tiers?.[3]??500}억 이내 창고, 또는 냉동이면서 위치·금액 중 하나만 벗어남<br><b>C 참고</b> 대상 지역 기타 창고 · <b>D</b> 금액 등 정보 부족</p>
   <p>위치 1순위 ${(c.location_tiers?.[1]||[]).join('·')} / 2순위 ${(c.location_tiers?.[2]||[]).join('·')} / 3순위 ${(c.location_tiers?.[3]||[]).join('·')}</p>
   <p>기준 수정: collector/criteria.yaml · 경매·중개 물건 추가: collector/manual.yaml</p>`;
  $('#status').innerHTML=(d.status||[]).map(s=>`<div><span class="${s.ok?'ok':'bad'}">${s.ok?'●':'●'}</span> ${esc(s.name)} — ${s.count}건 ${s.message?'· '+esc(s.message.slice(0,200)):''}</div>`).join('');
  render();}).catch(()=>{$('#upd').textContent='데이터를 불러오지 못했습니다.'});
}
init();
</script>
</body>
</html>
